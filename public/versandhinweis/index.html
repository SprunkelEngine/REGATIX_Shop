<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Bottom Sheet Example</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a href="#" id="openSheet">Öffne Info-Panel</a>

  <div id="overlay"></div>
  <div id="bottomSheet">
	<div class="sheet-header">
	  <img src="https://picsum.photos/60" alt="Beispielbild" class="sheet-img">
	  <button id="closeSheet" aria-label="Schließen">✖</button>
	</div>
	<div class="sheet-content">
	  <h2>Willkommen zum Info-Panel!</h2>
	  <p>Dies ist ein Beispieltext. Hier kannst du beliebigen Inhalt platzieren.</p>
	</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
